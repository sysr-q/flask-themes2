[project]
name = "Flask-Themes2"
description = "Provides infrastructure for theming Flask applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Carter", email = "chris@gibsonsec.org" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://flask-themes2.readthedocs.io"
Source = "https://github.com/sysr-q/flask-themes2"

[dependency-groups]
dev = [
    "ruff",
    {include-group = "tox"},
    {include-group = "pre-commit"},
    {include-group = "docs"},
    {include-group = "tests"},
    {include-group = "typing"},
]
tox = [
    "tox>=4.39",
    "tox-uv",
]
pre-commit = [
    "pre-commit",
    "pre-commit-uv",
]
docs = [
    "sphinx",
]
tests = [
    "pytest",
    "pytest-cov",
]
typing = [
    "mypy",
    "pyright",
    "pytest",
]

[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "flask_themes2"

[tool.flit.sdist]
include = [
    "base_theme/",
    "docs/",
    "example/",
    "tests/",
    "new-theme.py",
    "uv.lock",
]
exclude = [
    "docs/_build/",
]

[tool.uv]
default-groups = ["dev", "pre-commit", "tests", "typing"]

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.coverage.run]
branch = true
source = ["flask_themes2", "tests"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING",
    "raise NotImplementedError",
    ": \\.{3}",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.mypy]
python_version = "3.10"
files = ["src/flask_themes2/"]
warn_unused_configs = true
strict = true

[tool.pyright]
pythonVersion = "3.10"
include = ["src"]
typeCheckingMode = "standard"


[tool.tox]
env_list = [
    "py3.14", "py3.13", "py3.12", "py3.11", "py3.10",
    "style",
    "typing",
    "docs",
]

[tool.tox.env_run_base]
description = "pytest on latest dependency versions"
runner = "uv-venv-lock-runner"
package = "wheel"
wheel_build_env = ".pkg"
constrain_package_deps = true
use_frozen_constraints = true
dependency_groups = ["tests"]
pass_env = ["CI"]
env_tmp_dir = "{toxworkdir}/tmp/{envname}"
commands = [[
    "pytest", "-v", "--capture=tee-sys", "--tb=short", "--basetemp={env_tmp_dir}",
    {replace = "posargs", default = [], extend = true},
]]

[tool.tox.env.style]
description = "run all pre-commit hooks on all files"
dependency_groups = ["pre-commit"]
skip_install = true
commands = [["pre-commit", "run", "--all-files"]]

[tool.tox.env.typing]
description = "run static type checkers"
dependency_groups = ["typing"]
commands = [
    ["mypy"],
    ["pyright"],
]

[tool.tox.docs]
docs_dir = "{tox_root}{/}docs"
build_dir = "{[tool.tox.docs]docs_dir}{/}_build"
sphinx_args = ["--show-traceback", "--fail-on-warning", "--keep-going", "--fresh-env"]

[tool.tox.env.docs]
description = "build docs"
dependency_groups = ["docs"]
commands = [[
    "sphinx-build",
    { replace = "ref", of = ["tool", "tox", "docs", "sphinx_args"], extend = true },
    { replace = "posargs", default = [], extend = true },
    "--builder", "dirhtml",
    "{[tool.tox.docs]docs_dir}", "{[tool.tox.docs]build_dir}{/}dirhtml",
]]

[tool.tox.env.update-pre_commit]
description = "update pre-commit pins"
labels = ["update"]
dependency_groups = ["pre-commit"]
skip_install = true
commands = [["pre-commit", "autoupdate", "--freeze", "-j4"]]

[tool.tox.env.update-requirements]
description = "update uv lock"
labels = ["update"]
dependency_groups = []
no_default_groups = true
skip_install = true
commands = [["uv", "lock", {replace = "posargs", default = ["-U"], extend = true}]]
